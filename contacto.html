    <main class="container mt-4 mb-5">
        <h1 class="text-center">Formulario de Contacto</h1>
        <p class="text-center">¡Estamos aquí para ayudarte! Escríbenos para cualquier duda o sugerencia.</p>
        
        <!-- Le agregamos id="form-contacto" -->
        <form id="form-contacto">
            <div class="mb-3">
                <label for="nombre-input" class="form-label">Nombre y Apellido</label>
                <input type="text" class="form-control" id="nombre-input" placeholder="Escribe tu nombre y apellido aquí">
            </div>
            <div class="mb-3">
                <label for="email-input" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email-input" placeholder="tu-correo@ejemplo.com">
            </div>
            <div class="mb-3">
              <label for="telefono-input" class="form-label">Número de teléfono</label>
              <input type="tel" class="form-control" id="telefono-input" placeholder="+56 9 1234 5678">
          </div>
            <div class="mb-3">
                <label for="mensaje-input" class="form-label">Tu mensaje</label>
                <textarea class="form-control" id="mensaje-input" rows="5" placeholder="Cuéntanos en qué podemos ayudarte"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </main>
